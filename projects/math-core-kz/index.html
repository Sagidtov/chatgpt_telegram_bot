<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Core KZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent} :root{--red:#dc2626;--blue:#2563eb;--purple:#7c3aed;--green:#059669;--orange:#d97706;--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--dim:#94a3b8}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:16px;overflow-x:hidden;min-height:100vh}.mobile-container{padding:15px}#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1000;transition:.5s}.loading-title{font-size:28px;font-weight:800;margin-bottom:16px;text-align:center;color:var(--red)}.loading-subtitle{font-size:18px;color:var(--dim);margin-bottom:30px;text-align:center;padding:0 20px}.formula-scroll{width:90%;height:120px;overflow:hidden;position:relative;background:rgba(0,0,0,.22);border-radius:12px;margin-bottom:25px}.formula-scroll-content{position:absolute;width:100%;animation:scrollFormulas 18s linear infinite}@keyframes scrollFormulas{0%{transform:translateY(0)}100%{transform:translateY(-760px)}}.formula-item{padding:14px 15px;font-family:'Courier New',monospace;font-size:17px;color:var(--green);border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#main-content{display:none;min-height:100vh}.top-bar{position:sticky;top:0;background:var(--card);padding:15px;border-bottom:2px solid var(--red);z-index:100}.subject-selector{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}.subject-btn{padding:10px 15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:9px;color:var(--dim);font-weight:600;white-space:nowrap;flex-shrink:0}.subject-btn.active{background:var(--red);color:#fff;border-color:var(--red)}.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;padding:20px 15px}.topic-card{background:var(--card);border-radius:14px;padding:20px 14px;text-align:center;border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:145px}.topic-card:active{transform:scale(.98);border-color:var(--red)}.topic-icon{font-size:32px;margin-bottom:10px}.topic-name{font-weight:700;font-size:16px;margin-bottom:5px}.topic-desc{font-size:12px;color:var(--dim)}.formula-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}.formula-header{position:sticky;top:0;background:var(--card);padding:20px 15px;border-bottom:2px solid var(--red);z-index:10}.formula-title{font-size:23px;font-weight:800;color:var(--red);padding-right:86px}.formula-subtitle{color:var(--dim);font-size:15px;margin-top:8px;padding-right:86px}.back-btn{position:absolute;top:20px;right:15px;background:var(--red);color:#fff;border:0;padding:9px 14px;border-radius:8px;font-weight:700}.formula-content{padding:20px 15px}.formula-block,.data-block,.method-block,.interactive-block{border-radius:12px;padding:18px;margin-bottom:18px;background:var(--card);border-left:4px solid var(--red)}.formula-block-title,.data-title,.method-title,.interactive-title{font-size:18px;font-weight:800;margin-bottom:14px;color:var(--orange)}.formula-box{background:rgba(0,0,0,.3);border-radius:10px;padding:18px;margin:14px 0;border:1px solid rgba(255,255,255,.1);overflow-x:auto}.formula-text{font-family:'Courier New',monospace;font-size:19px;color:var(--green);text-align:center;white-space:pre-line}.formula-explanation{margin-top:14px;padding:14px;background:rgba(5,150,105,.1);border-radius:9px;border:1px solid rgba(5,150,105,.3)}.explanation-title{color:var(--green);font-weight:800;margin-bottom:8px}.explanation-text{white-space:pre-line}.memory-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}.memory-table th{background:var(--red);color:#fff;padding:11px 8px;text-align:left}.memory-table td{padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.1)}.memory-table tr:nth-child(even){background:rgba(255,255,255,.03)}.data-block{background:rgba(37,99,235,.1);border-color:var(--blue)}.data-title{color:#60a5fa}.data-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.data-item{background:rgba(0,0,0,.22);border-radius:9px;padding:13px 8px;text-align:center}.data-value{font-size:18px;font-weight:800;color:#60a5fa;margin-bottom:4px}.data-label{font-size:12px;color:var(--dim)}.method-block{background:rgba(124,58,237,.1);border-color:var(--purple)}.method-title{color:#a78bfa}.method-step{margin-bottom:13px;padding-left:22px;position:relative}.method-step:before{content:'→';position:absolute;left:0;color:#a78bfa;font-weight:900}.interactive-block{background:rgba(217,119,6,.1);border-color:var(--orange)}.math-input{width:100%;padding:12px 14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.2);border-radius:9px;color:#fff;font-size:16px;margin:8px 0 12px}.calc-btn{width:100%;padding:14px;background:var(--red);color:#fff;border:0;border-radius:9px;font-weight:800;font-size:16px}.result-box{margin-top:15px;padding:14px;background:rgba(0,0,0,.3);border-radius:9px;border:1px solid var(--green)}.result-title{color:var(--green);font-weight:800;margin-bottom:8px}@media(max-width:480px){.topic-grid{grid-template-columns:repeat(2,1fr)}.loading-title{font-size:24px}.formula-text{font-size:17px}}@media(max-width:360px){.topic-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loading"><h1 class="loading-title">МАТЕМАТИКА ФОРМУЛАЛАРЫ</h1><p class="loading-subtitle">Тригонометрия және логарифмнің мобильді жинағы</p><div class="formula-scroll"><div class="formula-scroll-content" id="formulaScroll"></div></div><div style="color:var(--dim);text-align:center">Формулалар жинақталуда...<br><span id="loadingPercent">0%</span></div></div>
<div id="main-content"><div class="top-bar"><div class="subject-selector"><button class="subject-btn active" data-subject="trigonometry">🔺 Тригонометрия</button><button class="subject-btn" data-subject="logarithm">📈 Логарифм</button><button class="subject-btn" data-subject="all">📚 Барлығы</button></div></div><div class="mobile-container"><div class="topic-grid" id="topicGrid"></div></div></div>
<div class="formula-screen" id="formulaScreen"><div class="formula-header"><div class="formula-title" id="screenTitle"></div><div class="formula-subtitle" id="screenSubtitle"></div><button class="back-btn" id="backBtn">Артқа</button></div><div class="formula-content" id="formulaContent"></div></div>
<script>
const DB={trigonometry:{topics:[{id:'trig-basics',icon:'🎯',name:'Негізгі анықтамалар',desc:'sin, cos, tan түсіну',content:{title:'ТРИГОНОМЕТРИЯНЫҢ НЕГІЗІ',subtitle:'Үшбұрыштағы қатынастар',sections:[{type:'formula',title:'📐 Негізгі анықтама',content:'Тік бұрышты үшбұрыш үшін:',formula:'sin(θ) = қарсы катет / гипотенуза\ncos(θ) = іргелес катет / гипотенуза\ntan(θ) = қарсы катет / іргелес катет',explanation:'θ — бұрыш. Гипотенуза — ең ұзын қабырға.'},{type:'table',title:'📊 Негізгі қатынастар',rows:[['Функция','Анықтама','Аралық'],['sin(θ)','Қарсы/Гипотенуза','-1..1'],['cos(θ)','Іргелес/Гипотенуза','-1..1'],['tan(θ)','sin/cos','∞']]},{type:'method',title:'🧠 Жаттау әдісі',steps:['sin — қарсы қабырға','cos — көрші қабырға','tan = sin / cos','Гипотенуза әрқашан ең ұзын']}]}},{id:'trig-values',icon:'📈',name:'Негізгі бұрыштар',desc:'0°, 30°, 45°, 60°, 90°',content:{title:'НЕГІЗГІ БҰРЫШ МӘНДЕРІ',subtitle:'Есте сақтау керек мәндер',sections:[{type:'table',title:'🎯 Маңызды бұрыштар',rows:[['Бұрыш','sin','cos','tan'],['0°','0','1','0'],['30°','1/2','√3/2','1/√3'],['45°','√2/2','√2/2','1'],['60°','√3/2','1/2','√3'],['90°','1','0','∞']]},{type:'data',title:'💡 Сандық мәндер',data:[['sin30','0.5'],['cos60','0.5'],['tan45','1'],['sin45','0.707'],['cos30','0.866'],['sin60','0.866']]}]}},{id:'trig-formulas',icon:'📝',name:'Формулалар',desc:'Негізгі теңдіктер',content:{title:'ТРИГОНОМЕТРИЯЛЫҚ ФОРМУЛАЛАР',subtitle:'Маңызды формулалар',sections:[{type:'formula',title:'🌟 Пифагор теңдігі',content:'Негізгі теңдік:',formula:'sin²(θ) + cos²(θ) = 1',explanation:'Бірлік шеңберден шығады.'},{type:'formula',title:'➕ Қосу формулалары',content:'Екі бұрыш қосындысы:',formula:'sin(A+B)=sinA·cosB+cosA·sinB\ncos(A+B)=cosA·cosB−sinA·sinB\ntan(A+B)=(tanA+tanB)/(1−tanA·tanB)',explanation:'Күрделі бұрыштарды ашуға көмектеседі.'},{type:'formula',title:'✖️ Екі еселеу',content:'Бұрышты екі еселеу:',formula:'sin(2θ)=2sinθcosθ\ncos(2θ)=cos²θ−sin²θ\ntan(2θ)=2tanθ/(1−tan²θ)',explanation:'A=B=θ деп алғанда шығады.'}]}},{id:'trig-circle',icon:'🌀',name:'Шеңбер',desc:'Бірлік шеңбер',content:{title:'БІРЛІК ШЕҢБЕР',subtitle:'Координаталар арқылы түсіну',sections:[{type:'explanation',title:'🎯 Бірлік шеңбер',content:'Радиусы 1 шеңберде кез келген нүкте:\nx = cos(θ)\ny = sin(θ)\nНүкте координатасы: (cosθ, sinθ)'},{type:'interactive',title:'🔄 Бұрышты есептеу',mode:'trig'}]}}]},logarithm:{topics:[{id:'log-basics',icon:'🔍',name:'Анықтама',desc:'Логарифм деген не?',content:{title:'ЛОГАРИФМ НЕГІЗІ',subtitle:'Дәрежені кері табу',sections:[{type:'formula',title:'📝 Анықтама',content:'Логарифм былай анықталады:',formula:'logₐ(b) = c ⇔ aᶜ = b',explanation:'a санын қанша дәрежеге көтерсек b шығады?'},{type:'method',title:'🧠 Мысалдар',steps:['log₁₀(100)=2, себебі 10²=100','log₂(8)=3, себебі 2³=8','log₅(25)=2, себебі 5²=25']}]}},{id:'log-properties',icon:'📊',name:'Қасиеттері',desc:'Негізгі ережелер',content:{title:'ЛОГАРИФМ ҚАСИЕТТЕРІ',subtitle:'Есте сақтау керек ережелер',sections:[{type:'formula',title:'➕ Көбейту',content:'Көбейтуді қосуға айналдырады:',formula:'logₐ(x·y)=logₐ(x)+logₐ(y)',explanation:'Көбейтіндінің логарифмі — қосынды.'},{type:'formula',title:'➗ Бөлу',content:'Бөлуді азайтуға айналдырады:',formula:'logₐ(x/y)=logₐ(x)-logₐ(y)',explanation:'Бөліндінің логарифмі — айырма.'},{type:'formula',title:'⚡ Дәреже',content:'Дәрежені көбейткішке шығарады:',formula:'logₐ(xᵖ)=p·logₐ(x)',explanation:'Дәреже көрсеткіші алдына шығады.'}]}},{id:'log-types',icon:'🎯',name:'Түрлері',desc:'lg, ln, log₂',content:{title:'ЛОГАРИФМ ТҮРЛЕРІ',subtitle:'Әртүрлі негіздер',sections:[{type:'explanation',title:'🔢 Ондық логарифм',content:'lg(x) немесе log₁₀(x). Мысалы: lg(1000)=3.'},{type:'explanation',title:'🌿 Натурал логарифм',content:'ln(x), негізі e≈2.718. Мысалы: ln(e)=1.'},{type:'explanation',title:'💻 Екілік логарифм',content:'log₂(x). Компьютерлік ғылымда қолданылады.'},{type:'interactive',title:'🔄 Логарифм есептеу',mode:'log'}]}}]}};
const formulas=['sin²θ + cos²θ = 1','sin(A±B)=sinAcosB ± cosAsinB','cos(A±B)=cosAcosB ∓ sinAsinB','tanθ=sinθ/cosθ','logₐ(xy)=logₐx+logₐy','logₐ(x/y)=logₐx−logₐy','logₐ(xᵖ)=p·logₐx','sin2θ=2sinθcosθ','cos2θ=cos²θ−sin²θ','log₁₀100=2','ln e=1','log₂8=3'];
document.addEventListener('DOMContentLoaded',async()=>{formulas.forEach(f=>{const d=document.createElement('div');d.className='formula-item';d.textContent=f;formulaScroll.appendChild(d)});for(let i=0;i<=100;i+=10){loadingPercent.textContent=i+'%';await new Promise(r=>setTimeout(r,90))}loading.style.opacity='0';setTimeout(()=>{loading.style.display='none';document.getElementById('main-content').style.display='block'},450);showTopics('trigonometry');setupNav();backBtn.onclick=closeFormulaScreen});
function setupNav(){document.querySelectorAll('.subject-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.subject-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');btn.dataset.subject==='all'?showAllTopics():showTopics(btn.dataset.subject)})}
function showTopics(subject){topicGrid.innerHTML='';DB[subject].topics.forEach(t=>topicGrid.appendChild(card(t)))}
function showAllTopics(){topicGrid.innerHTML='';['trigonometry','logarithm'].forEach(s=>DB[s].topics.forEach(t=>topicGrid.appendChild(card(t))))}
function card(t){const d=document.createElement('div');d.className='topic-card';d.innerHTML=`<div class="topic-icon">${t.icon}</div><div class="topic-name">${t.name}</div><div class="topic-desc">${t.desc}</div>`;d.onclick=()=>openTopic(t);return d}
function openTopic(t){screenTitle.textContent=t.content.title;screenSubtitle.textContent=t.content.subtitle;formulaContent.innerHTML='';t.content.sections.forEach(s=>formulaContent.appendChild(section(s)));formulaScreen.style.display='block';document.body.style.overflow='hidden'}
function section(s){const d=document.createElement('div');if(s.type==='formula')d.innerHTML=`<div class="formula-block"><div class="formula-block-title">${s.title}</div><div>${s.content}</div><div class="formula-box"><div class="formula-text">${s.formula}</div></div><div class="formula-explanation"><div class="explanation-title">Түсіндірме:</div><div>${s.explanation}</div></div></div>`;if(s.type==='table'){let h=`<div class="formula-block"><div class="formula-block-title">${s.title}</div><table class="memory-table">`;s.rows.forEach((r,i)=>{h+='<tr>'+r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')+'</tr>'});d.innerHTML=h+'</table></div>'}if(s.type==='data')d.innerHTML=`<div class="data-block"><div class="data-title">${s.title}</div><div class="data-grid">${s.data.map(x=>`<div class="data-item"><div class="data-value">${x[1]}</div><div class="data-label">${x[0]}</div></div>`).join('')}</div></div>`;if(s.type==='method')d.innerHTML=`<div class="method-block"><div class="method-title">${s.title}</div>${s.steps.map(x=>`<div class="method-step">${x}</div>`).join('')}</div>`;if(s.type==='explanation')d.innerHTML=`<div class="formula-block"><div class="formula-block-title">${s.title}</div><div class="explanation-text">${s.content}</div></div>`;if(s.type==='interactive')d.innerHTML=interactive(s.mode);return d}
function interactive(mode){if(mode==='trig')return `<div class="interactive-block"><div class="interactive-title">🔄 Бұрышты есептеу</div><input id="angleInput" class="math-input" type="number" placeholder="Бұрыш, мысалы 45"><button class="calc-btn" onclick="calcTrig()">Есептеу</button><div id="trigResult"></div></div>`;return `<div class="interactive-block"><div class="interactive-title">🔄 Логарифм есептеу</div><input id="logNumber" class="math-input" type="number" placeholder="Сан, мысалы 100"><button class="calc-btn" onclick="calcLog()">Есептеу</button><div id="logResult"></div></div>`}
function calcTrig(){const a=parseFloat(angleInput.value);if(!Number.isFinite(a)){trigResult.innerHTML='<div class="result-box">Сан енгіз.</div>';return}const r=a*Math.PI/180;trigResult.innerHTML=`<div class="result-box"><div class="result-title">Нәтиже:</div><div>sin(${a}°)=${Math.sin(r).toFixed(3)}</div><div>cos(${a}°)=${Math.cos(r).toFixed(3)}</div><div>tan(${a}°)=${Math.tan(r).toFixed(3)}</div></div>`}
function calcLog(){const n=parseFloat(logNumber.value);if(!Number.isFinite(n)||n<=0){logResult.innerHTML='<div class="result-box">0-ден үлкен сан енгіз.</div>';return}logResult.innerHTML=`<div class="result-box"><div class="result-title">Логарифмдер:</div><div>log₁₀(${n})=${Math.log10(n).toFixed(3)}</div><div>ln(${n})=${Math.log(n).toFixed(3)}</div><div>log₂(${n})=${Math.log2(n).toFixed(3)}</div></div>`}
function closeFormulaScreen(){formulaScreen.style.display='none';document.body.style.overflow='auto'}
</script>
</body>
</html>
