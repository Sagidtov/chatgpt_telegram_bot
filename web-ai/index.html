<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon AI</title><style>:root{--c:#00f6ff;--p:#ff2bd6;--g:#42ff9f;--t:#eefcff;--m:rgba(238,252,255,.66)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 12%,#17245f,#060817 55%,#02030a);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,rgba(255,255,255,.04) 51%);background-size:100% 4px;mix-blend-mode:overlay;opacity:.25}main{position:fixed;inset:0;display:grid;grid-template-columns:1fr minmax(320px,430px);gap:20px;padding:clamp(10px,2.4vw,28px)}.stage,.panel{position:relative;overflow:hidden;border:1px solid rgba(0,246,255,.18);border-radius:30px;background:rgba(0,0,0,.12);box-shadow:0 0 70px rgba(0,246,255,.08),inset 0 0 80px rgba(255,43,214,.04)}canvas{position:absolute;inset:0;width:100%;height:100%}.brand{position:absolute;top:20px;left:22px;z-index:2;font-weight:900;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 18px var(--c)}.hero{position:absolute;left:22px;right:22px;bottom:20px;z-index:2;max-width:720px;padding:16px;border-radius:24px;border:1px solid rgba(255,43,214,.22);background:rgba(5,8,25,.58);backdrop-filter:blur(14px)}h1{margin:0 0 8px;font-size:clamp(30px,6vw,72px);line-height:.9;letter-spacing:-.06em}p{margin:0;color:var(--m);line-height:1.45}.panel{z-index:5;display:flex;flex-direction:column;min-height:0;background:linear-gradient(145deg,rgba(6,10,28,.84),rgba(18,6,34,.68));backdrop-filter:blur(18px)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:18px;border-bottom:1px solid rgba(255,255,255,.08)}.title{font-weight:900;letter-spacing:.1em;text-transform:uppercase}.pill{font-size:12px;color:var(--g);border:1px solid rgba(66,255,159,.28);border-radius:999px;padding:7px 10px;background:rgba(66,255,159,.07)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}.metric{padding:10px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}.metric b{display:block;color:var(--c)}.metric span{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{max-width:93%;padding:12px 13px;border-radius:18px;line-height:1.42;font-size:14px;white-space:pre-wrap;animation:rise .2s ease-out}.ai{align-self:flex-start;border:1px solid rgba(0,246,255,.18);background:rgba(0,246,255,.07)}.user{align-self:flex-end;border:1px solid rgba(255,43,214,.18);background:rgba(255,43,214,.09)}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}.chip{border:1px solid rgba(0,246,255,.18);border-radius:999px;background:rgba(0,246,255,.06);color:var(--t);padding:9px 11px;font:inherit;font-size:12px;cursor:pointer}.chip:active,.send:active{transform:scale(.95)}form{display:flex;gap:10px;padding:14px;border-top:1px solid rgba(255,255,255,.08)}textarea{flex:1;height:48px;resize:none;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(0,0,0,.26);color:var(--t);outline:none;padding:13px 14px;font:inherit;font-size:14px}.send{width:54px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--c),var(--p));color:#031018;font-weight:1000;font-size:20px;cursor:pointer}@media(max-width:860px){main{grid-template-columns:1fr;padding:10px}.stage{min-height:42vh;border-radius:24px}.panel{min-height:53vh;border-radius:24px}.hero{left:14px;right:14px;bottom:14px}.brand{left:16px;top:16px}.msgs{max-height:30vh}h1{font-size:34px}}</style></head><body><main><section class="stage"><canvas id="scene"></canvas><div class="brand">NEON AI CORE</div><div class="hero"><h1>ИИ прямо в сайте</h1><p>Автономный веб-ассистент: интенты, память, планирование, анализ тона и живое Canvas-ядро. Без сервера и внешних API.</p></div></section><aside class="panel"><div class="top"><div class="title">AI Terminal</div><div class="pill">ONLINE</div></div><div class="metrics"><div class="metric"><b id="tone">0.50</b><span>tone</span></div><div class="metric"><b id="conf">0.00</b><span>conf</span></div><div class="metric"><b id="mem">0</b><span>memory</span></div></div><div id="msgs" class="msgs"></div><div id="chips" class="chips"></div><form id="form"><textarea id="input" placeholder="Напиши: что ты умеешь, запомни..., сделай план..., очисти память"></textarea><button class="send">↗</button></form></aside></main><script>(()=>{"use strict";const K={dpr:2,n:58,p:240,tau:Math.PI*2,store:"neon-ai-v1"};class U{static cl(v,a,b){return Math.max(a,Math.min(b,v))}static lp(a,b,t){return a+(b-a)*t}static ds(a,b,c,d){return Math.hypot(c-a,d-b)}static r(a,b){return a+Math.random()*(b-a)}static norm(s){return String(s).toLowerCase().replace(/ё/g,"е").trim()}}class Memory{constructor(){this.data={facts:[],history:[]};try{this.data={...this.data,...JSON.parse(localStorage.getItem(K.store)||"{}")}catch{}}save(){localStorage.setItem(K.store,JSON.stringify(this.data))}add(f){f=f.trim();if(f){this.data.facts=[f,...this.data.facts.filter(x=>x!==f)].slice(0,16);this.save()}}clear(){this.data={facts:[],history:[]};this.save()}}class Brain{constructor(mem){this.mem=mem}answer(q){const s=U.norm(q);let tone=.5;["класс","супер","спасибо","нрав"].forEach(w=>s.includes(w)&&(tone+=.12));["нерв","бесит","плохо","ошиб","туп"].forEach(w=>s.includes(w)&&(tone-=.14));tone=U.cl(tone,0,1);let conf=.45,text="Я понял запрос. Могу разложить его на шаги, запомнить факт или предложить структуру. Напиши конкретнее — и я отвечу точнее.";if(/что ты умеешь|помощь|help/.test(s)){conf=.96;text="Я умею локально: отвечать по шаблонам интентов, запоминать факты в браузере, строить короткие планы, анализировать тон сообщения и управлять визуальным AI-ядром. Команды: запомни ..., что ты помнишь, сделай план ..., очисти память."}else if(s.startsWith("запомни")){conf=.94;const fact=q.replace(/^запомни/i,"").trim();this.mem.add(fact);text=fact?`Запомнил: ${fact}`:"Напиши после слова «запомни» сам факт."}else if(/что ты помнишь|память/.test(s)){conf=.9;text=this.mem.data.facts.length?"Я помню:\n- "+this.mem.data.facts.join("\n- "):"Память пока пустая."}else if(/очисти память|сброс/.test(s)){conf=.98;this.mem.clear();text="Память очищена."}else if(/план|сделай план/.test(s)){conf=.86;const topic=q.replace(/сделай план|план/ig,"").trim()||"задачи";text=`План по теме «${topic}»:\n1. Определи цель и главный результат.\n2. Разбей работу на 3-5 маленьких шагов.\n3. Сделай первый рабочий прототип.\n4. Проверь на телефоне и исправь неудобства.\n5. Улучши визуал и скорость.`}this.mem.data.history.push({q,a:text,t:Date.now()});this.mem.data.history=this.mem.data.history.slice(-20);this.mem.save();return{tone,conf,text}}}class UI{constructor(brain){this.brain=brain;this.m=document.getElementById("msgs");this.i=document.getElementById("input");this.t=document.getElementById("tone");this.c=document.getElementById("conf");this.mm=document.getElementById("mem");document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();this.send()});this.chips(["Что ты умеешь?","Запомни мой проект — AI сайт","Что ты помнишь?","Сделай план запуска сайта"]);this.add("ai","Готов. Я работаю прямо в браузере, без API. Попробуй команду или напиши задачу.")}chips(a){const box=document.getElementById("chips");box.innerHTML="";a.forEach(x=>{const b=document.createElement("button");b.className="chip";b.textContent=x;b.onclick=()=>{this.i.value=x;this.send()};box.appendChild(b)})}add(w,t){const d=document.createElement("div");d.className="msg "+w;d.textContent=t;this.m.appendChild(d);this.m.scrollTop=this.m.scrollHeight}send(){const q=this.i.value.trim();if(!q)return;this.i.value="";this.add("user",q);const r=this.brain.answer(q);setTimeout(()=>this.add("ai",r.text),120);this.t.textContent=r.tone.toFixed(2);this.c.textContent=r.conf.toFixed(2);this.mm.textContent=this.brain.mem.data.facts.length;window.__energy=r.conf}}class Input{constructor(el){this.x=0;this.y=0;this.tx=0;this.ty=0;this.on=false;el.addEventListener("pointerdown",e=>{this.on=true;this.set(e);el.setPointerCapture(e.pointerId)});el.addEventListener("pointermove",e=>this.set(e));el.addEventListener("pointerup",()=>this.on=false);el.addEventListener("pointercancel",()=>this.on=false)}set(e){const r=e.target.getBoundingClientRect();this.tx=e.clientX-r.left;this.ty=e.clientY-r.top}up(){this.x=U.lp(this.x,this.tx,.18);this.y=U.lp(this.y,this.ty,.18)}}class Node{constructor(w,h){this.bx=U.r(0,w);this.by=U.r(0,h);this.x=this.bx;this.y=this.by;this.ph=U.r(0,K.tau);this.e=0}up(t,input,c){let tx=this.bx+Math.cos(t*.001+this.ph)*20,ty=this.by+Math.sin(t*.0012+this.ph)*20;if(input.on){const d=U.ds(input.x,input.y,this.x,this.y),inf=U.cl(1-d/K.p,0,1),a=Math.atan2(this.y-input.y,this.x-input.x);tx+=Math.cos(a)*inf*55;ty+=Math.sin(a)*inf*55;this.e=U.lp(this.e,inf,.16)}else this.e=U.lp(this.e,window.__energy||0,.03);this.x=U.lp(this.x,tx,.07);this.y=U.lp(this.y,ty,.07)}}class Scene{constructor(){this.cv=document.getElementById("scene");this.ctx=this.cv.getContext("2d");this.input=new Input(this.cv);this.nodes=[];this.w=1;this.h=1;addEventListener("resize",()=>this.resize(),{passive:true});this.resize();requestAnimationFrame(t=>this.loop(t))}resize(){const d=Math.min(devicePixelRatio||1,K.dpr);this.w=this.cv.clientWidth||innerWidth;this.h=this.cv.clientHeight||innerHeight;this.cv.width=this.w*d;this.cv.height=this.h*d;this.ctx.setTransform(d,0,0,d,0,0);this.nodes=Array.from({length:innerWidth<760?38:K.n},()=>new Node(this.w,this.h))}loop(t){this.input.up();const g=this.ctx,c={x:this.w/2,y:this.h/2};g.clearRect(0,0,this.w,this.h);g.fillStyle="rgba(2,3,10,.7)";g.fillRect(0,0,this.w,this.h);for(const n of this.nodes)n.up(t,this.input,c);for(let i=0;i<this.nodes.length;i++){const a=this.nodes[i];for(let j=i+1;j<this.nodes.length;j++){const b=this.nodes[j],d=U.ds(a.x,a.y,b.x,b.y);if(d<145){g.strokeStyle=`rgba(0,246,255,${(1-d/145)*(.13+a.e*.45)})`;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}g.shadowBlur=16+a.e*25;g.shadowColor=a.e>.25?"#ff2bd6":"#00f6ff";g.fillStyle=g.shadowColor;g.beginPath();g.arc(a.x,a.y,2+a.e*3,0,K.tau);g.fill()}const e=window.__energy||0,r=64+e*35+Math.sin(t*.006)*6;const grd=g.createRadialGradient(c.x,c.y,5,c.x,c.y,r*2.5);grd.addColorStop(0,"#fff");grd.addColorStop(.15,"rgba(0,246,255,.95)");grd.addColorStop(.55,"rgba(255,43,214,.24)");grd.addColorStop(1,"rgba(0,0,0,0)");g.shadowBlur=55+e*60;g.shadowColor="#00f6ff";g.fillStyle=grd;g.beginPath();g.arc(c.x,c.y,r*2.2,0,K.tau);g.fill();for(let k=0;k<3;k++){g.strokeStyle=k%2?"rgba(255,43,214,.55)":"rgba(0,246,255,.7)";g.lineWidth=2;g.beginPath();g.arc(c.x,c.y,r+k*22,t*.001+k,t*.001+k+Math.PI*1.25);g.stroke()}requestAnimationFrame(x=>this.loop(x))}}try{const mem=new Memory;new UI(new Brain(mem));new Scene}catch(e){document.body.innerHTML='<pre style="color:white;padding:20px">Ошибка: '+e.message+'</pre>'}})();</script></body></html>
