<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Block Breaker</title>
    <style>
        body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);font-family:Arial,sans-serif;color:white;overflow:hidden;touch-action:manipulation}.game-container{position:relative;text-align:center}canvas{border:4px solid rgba(255,255,255,.1);border-radius:8px;background:#0f0f1a;box-shadow:0 0 30px rgba(0,150,255,.2);margin-bottom:15px}.controls{display:flex;justify-content:center;gap:20px;margin-top:15px}.controls button{padding:15px 30px;font-size:1.2rem;cursor:pointer;background:linear-gradient(135deg,#00b4db 0%,#0083b0 100%);border:none;color:white;border-radius:50px;transition:all .3s;box-shadow:0 4px 15px rgba(0,180,219,.3);outline:none;user-select:none}.controls button:active{transform:translateY(2px);box-shadow:0 2px 10px rgba(0,180,219,.3)}.controls button:hover{background:linear-gradient(135deg,#0083b0 0%,#00b4db 100%)}.game-over,.level-complete{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(15,15,26,.95);padding:30px;border-radius:15px;width:80%;max-width:400px;z-index:10}.game-over{border:2px solid rgba(0,180,219,.5);box-shadow:0 0 30px rgba(0,150,255,.3)}.level-complete{border:2px solid rgba(0,219,146,.5);box-shadow:0 0 30px rgba(0,255,170,.3)}.game-over h1,.level-complete h1{font-size:2.5rem;margin-bottom:20px}.game-over h1{color:#00b4db;text-shadow:0 0 10px rgba(0,180,219,.5)}.level-complete h1{color:#00db9e;text-shadow:0 0 10px rgba(0,219,146,.5)}.game-over p,.level-complete p{font-size:1.2rem;margin-bottom:25px}.game-over button,.level-complete button{padding:12px 25px;font-size:1rem;cursor:pointer;border:none;color:white;border-radius:50px;transition:all .3s}.game-over button{background:linear-gradient(135deg,#00b4db 0%,#0083b0 100%);box-shadow:0 4px 15px rgba(0,180,219,.3)}.level-complete button{background:linear-gradient(135deg,#00db9e 0%,#00b48a 100%);box-shadow:0 4px 15px rgba(0,219,146,.3)}.score-display{position:absolute;top:10px;left:10px;font-size:1.2rem;color:#00b4db;text-shadow:0 0 5px rgba(0,180,219,.5)}@media(max-width:500px){canvas{width:95%;height:auto}.controls button{padding:12px 20px;font-size:1rem}}
    </style>
</head>
<body>
    <div class="game-container">
        <div class="score-display">Score: <span id="score">0</span> | Level: <span id="level">1</span></div>
        <canvas id="gameCanvas" width="350" height="500"></canvas>
        <div class="controls"><button id="leftButton">←</button><button id="rightButton">→</button></div>
    </div>
    <div class="game-over" id="gameOver"><h1>Game Over!</h1><p>Your Score: <span id="finalScore">0</span></p><button onclick="restartGame()">Play Again</button></div>
    <div class="level-complete" id="levelComplete"><h1>Level Complete!</h1><p>Your Score: <span id="levelScore">0</span></p><button onclick="nextLevel()">Next Level</button></div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),gameOverScreen=document.getElementById('gameOver'),levelCompleteScreen=document.getElementById('levelComplete'),finalScoreElement=document.getElementById('finalScore'),levelScoreElement=document.getElementById('levelScore'),scoreElement=document.getElementById('score'),levelElement=document.getElementById('level'),leftButton=document.getElementById('leftButton'),rightButton=document.getElementById('rightButton');
let paddleWidth=90;const originalPaddleWidth=paddleWidth,paddleHeight=12,ballRadius=8,brickRowCount=5,brickColumnCount=7,brickWidth=45,brickHeight=18,brickPadding=6,brickOffsetTop=50,brickOffsetLeft=20;let paddleX=(canvas.width-paddleWidth)/2,ballDX=3,ballDY=-3,score=0,currentLevel=1,gameOver=false,levelComplete=false,balls=[{x:canvas.width/2,y:canvas.height-30,dx:ballDX,dy:ballDY}],bonuses=[],isLeftPressed=false,isRightPressed=false,paddleSpeed=8,lastTimestamp=0,particles=[];
let box={x:canvas.width/2-60,y:150,width:120,height:120,color:'#b400db',visible:false,bricks:[]};const colors={paddle:'#00b4db',ball:'#ff2d75',bricks:['#00b4db','#00db9e','#b400db','#dbd200'],bonuses:{EXTRA_BALL:'#ff2d75',BIG_PADDLE:'#00b4db',SLOW_BALL:'#00db9e'}};let bricks=[];const BONUS_TYPES={EXTRA_BALL:'EXTRA_BALL',BIG_PADDLE:'BIG_PADDLE',SLOW_BALL:'SLOW_BALL'};
function initBricks(){bricks=[];box.bricks=[];if(currentLevel===1){box.visible=false;for(let c=0;c<brickColumnCount;c++){bricks[c]=[];for(let r=0;r<brickRowCount;r++)bricks[c][r]={x:0,y:0,status:1,color:colors.bricks[r%colors.bricks.length]}}}else{box.visible=true;const cols=4,rows=4,w=(box.width-10)/cols,h=(box.height-10)/rows;for(let c=0;c<cols;c++){box.bricks[c]=[];for(let r=0;r<rows;r++)box.bricks[c][r]={x:box.x+5+c*(w+2),y:box.y+5+r*(h+2),width:w,height:h,status:1,color:colors.bricks[(c+r)%colors.bricks.length]}}}}
class Particle{constructor(x,y,color){this.x=x;this.y=y;this.size=Math.random()*3+2;this.color=color;this.speedX=Math.random()*4-2;this.speedY=Math.random()*4-2;this.life=30}update(){this.x+=this.speedX;this.y+=this.speedY;this.life--}draw(){ctx.globalAlpha=this.life/30;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function drawPaddle(){const y=canvas.height-paddleHeight-10,g=ctx.createLinearGradient(paddleX,y,paddleX+paddleWidth,y+paddleHeight);g.addColorStop(0,colors.paddle);g.addColorStop(1,'#0083b0');roundRect(paddleX,y,paddleWidth,paddleHeight,6);ctx.fillStyle=g;ctx.shadowBlur=15;ctx.shadowColor=colors.paddle;ctx.fill();ctx.shadowBlur=0}
function drawBall(ball){const g=ctx.createRadialGradient(ball.x,ball.y,0,ball.x,ball.y,ballRadius);g.addColorStop(0,colors.ball);g.addColorStop(1,'#cc0052');ctx.beginPath();ctx.arc(ball.x,ball.y,ballRadius,0,Math.PI*2);ctx.fillStyle=g;ctx.shadowBlur=10;ctx.shadowColor=colors.ball;ctx.fill();ctx.shadowBlur=0}
function drawBrick(x,y,w,h,color){ctx.beginPath();ctx.rect(x,y,w,h);ctx.fillStyle=color;ctx.fill();ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-3,y+3);ctx.lineTo(x+3,y+3);ctx.closePath();ctx.fillStyle='rgba(255,255,255,.3)';ctx.fill();ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+3,y+h-3);ctx.lineTo(x+w-3,y+h-3);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fillStyle='rgba(0,0,0,.3)';ctx.fill()}
function drawBricks(){if(currentLevel!==1)return;bricks.forEach((col,c)=>col.forEach((b,r)=>{if(b.status){b.x=c*(brickWidth+brickPadding)+brickOffsetLeft;b.y=r*(brickHeight+brickPadding)+brickOffsetTop;drawBrick(b.x,b.y,brickWidth,brickHeight,b.color)}}))}
function drawBox(){if(!box.visible)return;ctx.strokeStyle=box.color;ctx.lineWidth=3;ctx.strokeRect(box.x,box.y,box.width,box.height);box.bricks.forEach(col=>col.forEach(b=>{if(b.status)drawBrick(b.x,b.y,b.width,b.height,b.color)}))}
function drawBonuses(){bonuses.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,10,0,Math.PI*2);ctx.fillStyle=b.color;ctx.shadowBlur=15;ctx.shadowColor=b.color;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='white';ctx.font='12px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.type==='EXTRA_BALL'?'+':b.type==='BIG_PADDLE'?'↔':'↓',b.x,b.y)})}
function drawParticles(){for(let i=particles.length-1;i>=0;i--){particles[i].draw();particles[i].update();if(particles[i].life<=0)particles.splice(i,1)}}
function hitRect(ball,b,w,h){return ball.x+ballRadius>b.x&&ball.x-ballRadius<b.x+w&&ball.y+ballRadius>b.y&&ball.y-ballRadius<b.y+h}
function bounceFrom(ball,b,w,h){const ox=(ballRadius+w/2)-Math.abs(ball.x-(b.x+w/2)),oy=(ballRadius+h/2)-Math.abs(ball.y-(b.y+h/2));if(ox>oy){ball.y+=ball.y<b.y+h/2?-oy:oy;ball.dy=-ball.dy}else{ball.x+=ball.x<b.x+w/2?-ox:ox;ball.dx=-ball.dx}}
function destroyBrick(ball,b,w,h,points){bounceFrom(ball,b,w,h);b.status=0;score+=points;scoreElement.textContent=score;for(let i=0;i<10;i++)particles.push(new Particle(b.x+w/2,b.y+h/2,b.color));if(Math.random()<.2){const type=Object.values(BONUS_TYPES)[Math.floor(Math.random()*3)];bonuses.push({x:b.x+w/2,y:b.y+h/2,type,color:colors.bonuses[type],dy:3})}}
function collisionDetection(ball){if(currentLevel===1){bricks.forEach(col=>col.forEach(b=>{if(b.status&&hitRect(ball,b,brickWidth,brickHeight))destroyBrick(ball,b,brickWidth,brickHeight,10)}));let all=bricks.every(col=>col.every(b=>!b.status));if(all)complete()}else if(box.visible){if(hitRect(ball,box,box.width,box.height)){bounceFrom(ball,box,box.width,box.height);for(let i=0;i<15;i++)particles.push(new Particle(ball.x,ball.y,box.color))}box.bricks.forEach(col=>col.forEach(b=>{if(b.status&&hitRect(ball,b,b.width,b.height))destroyBrick(ball,b,b.width,b.height,20)}));let all=box.bricks.every(col=>col.every(b=>!b.status));if(all)complete()}}
function complete(){levelComplete=true;levelScoreElement.textContent=score;levelCompleteScreen.style.display='block'}
function movePaddle(timestamp){if(!lastTimestamp){lastTimestamp=timestamp;return}const dt=timestamp-lastTimestamp;lastTimestamp=timestamp;if(isLeftPressed&&paddleX>0){paddleX-=paddleSpeed*(dt/16);if(paddleX<0)paddleX=0}if(isRightPressed&&paddleX<canvas.width-paddleWidth){paddleX+=paddleSpeed*(dt/16);if(paddleX>canvas.width-paddleWidth)paddleX=canvas.width-paddleWidth}}
function applyBonus(b){for(let i=0;i<15;i++)particles.push(new Particle(b.x,b.y,b.color));if(b.type===BONUS_TYPES.EXTRA_BALL)balls.push({x:paddleX+paddleWidth/2,y:canvas.height-paddleHeight-ballRadius-10,dx:ballDX*(Math.random()>.5?1:-1),dy:-Math.abs(ballDY)});if(b.type===BONUS_TYPES.BIG_PADDLE){paddleWidth=originalPaddleWidth*1.5;setTimeout(()=>paddleWidth=originalPaddleWidth,10000)}if(b.type===BONUS_TYPES.SLOW_BALL){balls.forEach(ball=>{ball.dx*=.7;ball.dy*=.7});setTimeout(()=>balls.forEach(ball=>{ball.dx/=.7;ball.dy/=.7}),5000)}}
function gameLoop(timestamp){if(gameOver||levelComplete)return;movePaddle(timestamp);ctx.clearRect(0,0,canvas.width,canvas.height);drawBricks();drawBox();balls.forEach(drawBall);drawPaddle();drawBonuses();drawParticles();for(let i=balls.length-1;i>=0;i--){const ball=balls[i];collisionDetection(ball);if(ball.x+ball.dx>canvas.width-ballRadius||ball.x+ball.dx<ballRadius)ball.dx=-ball.dx;if(ball.y+ball.dy<ballRadius)ball.dy=-ball.dy;if(ball.y+ball.dy>canvas.height-ballRadius-paddleHeight-10&&ball.x>paddleX&&ball.x<paddleX+paddleWidth){const pos=(ball.x-(paddleX+paddleWidth/2))/(paddleWidth/2),ang=pos*Math.PI/3,speed=Math.hypot(ball.dx,ball.dy);ball.dx=speed*Math.sin(ang);ball.dy=-speed*Math.cos(ang);for(let j=0;j<5;j++)particles.push(new Particle(ball.x,ball.y,colors.paddle))}if(ball.y+ball.dy>canvas.height+ballRadius){balls.splice(i,1);if(!balls.length){gameOver=true;gameOverScreen.style.display='block';finalScoreElement.textContent=score}}ball.x+=ball.dx;ball.y+=ball.dy}for(let i=bonuses.length-1;i>=0;i--){const b=bonuses[i];b.y+=b.dy;if(b.y>canvas.height)bonuses.splice(i,1);else if(b.y>canvas.height-paddleHeight-20&&b.x>paddleX&&b.x<paddleX+paddleWidth){applyBonus(b);bonuses.splice(i,1)}}requestAnimationFrame(gameLoop)}
function restartGame(){gameOver=false;gameOverScreen.style.display='none';score=0;scoreElement.textContent=score;currentLevel=1;levelElement.textContent=currentLevel;paddleWidth=originalPaddleWidth;paddleX=(canvas.width-paddleWidth)/2;balls=[{x:canvas.width/2,y:canvas.height-30,dx:ballDX,dy:ballDY}];bonuses=[];particles=[];initBricks();lastTimestamp=0;requestAnimationFrame(gameLoop)}
function nextLevel(){levelComplete=false;levelCompleteScreen.style.display='none';currentLevel++;levelElement.textContent=currentLevel;paddleX=(canvas.width-paddleWidth)/2;balls=[{x:canvas.width/2,y:canvas.height-30,dx:ballDX,dy:ballDY}];bonuses=[];particles=[];initBricks();lastTimestamp=0;requestAnimationFrame(gameLoop)}
leftButton.addEventListener('mousedown',()=>isLeftPressed=true);leftButton.addEventListener('mouseup',()=>isLeftPressed=false);leftButton.addEventListener('mouseleave',()=>isLeftPressed=false);leftButton.addEventListener('touchstart',e=>{e.preventDefault();isLeftPressed=true});leftButton.addEventListener('touchend',()=>isLeftPressed=false);rightButton.addEventListener('mousedown',()=>isRightPressed=true);rightButton.addEventListener('mouseup',()=>isRightPressed=false);rightButton.addEventListener('mouseleave',()=>isRightPressed=false);rightButton.addEventListener('touchstart',e=>{e.preventDefault();isRightPressed=true});rightButton.addEventListener('touchend',()=>isRightPressed=false);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='Left')isLeftPressed=true;if(e.key==='ArrowRight'||e.key==='Right')isRightPressed=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='Left')isLeftPressed=false;if(e.key==='ArrowRight'||e.key==='Right')isRightPressed=false});let touchX=null;canvas.addEventListener('touchstart',e=>{e.preventDefault();touchX=e.touches[0].clientX});canvas.addEventListener('touchmove',e=>{e.preventDefault();if(touchX!==null){const x=e.touches[0].clientX,dx=x-touchX;paddleX+=dx;if(paddleX<0)paddleX=0;if(paddleX>canvas.width-paddleWidth)paddleX=canvas.width-paddleWidth;touchX=x}});canvas.addEventListener('touchend',()=>touchX=null);initBricks();requestAnimationFrame(gameLoop);
</script>
</body>
</html>
