<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puzzle 11</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;padding:20px}.app{width:100%;max-width:480px;background:#fff;border-radius:22px;padding:24px;text-align:center;box-shadow:0 10px 30px #0002}h1{color:#ff6b6b;margin-bottom:14px}.top{display:flex;justify-content:space-between;color:#555;margin:12px 0}.bar{height:10px;background:#eee;border-radius:9px;overflow:hidden;margin:16px 0}.fill{height:100%;background:#4ecdc4;width:0}.row{display:flex;flex-wrap:wrap;justify-content:center;min-height:58px;margin:18px 0}.tile{width:48px;height:48px;border-radius:12px;background:#ff6b6b;color:white;margin:5px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;cursor:pointer;user-select:none}.tile.on{background:#4ecdc4;transform:translateY(-4px)}button{border:0;border-radius:999px;padding:13px 20px;margin:4px;font-weight:800;cursor:pointer}.ok{background:#4ecdc4;color:white}.clear,.hint{background:#ffe66d;color:#555}.next,.again{background:#ff6b6b;color:white}.msg{min-height:28px;color:#ff6b6b;font-weight:800}.over{position:fixed;inset:0;background:#fffffff2;display:none;align-items:center;justify-content:center;flex-direction:column}.over.show{display:flex}</style></head><body><main class="app"><h1>Puzzle 11</h1><div class="top"><b>Round <span id="round">1</span>/10</b><b><span id="time">30</span>s</b></div><div>Score: <span id="score">0</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="row" id="source"></div><div class="msg" id="msg"></div><div class="row" id="answer"></div><button class="clear" id="clear">Clear</button><button class="hint" id="hint">Hint</button><button class="ok" id="ok">Submit</button><button class="next" id="next" style="display:none">Next</button></main><section class="over" id="over"><h2>Finished!</h2><p>Score: <span id="final">0</span></p><button class="again" id="again">Play Again</button></section><script>const bank=['APPLE','TIGER','HOUSE','WATER','MUSIC','PHONE','LIGHT','TABLE','CHAIR','FRUIT','BANANA','PURPLE','DOCTOR','GARDEN','ROCKET','WINDOW','SUMMER','WINTER','PENCIL','COFFEE','PLANET','FOREST','RIVER','CLOUD','BRIDGE','CASTLE','MARKET','FLOWER','ORANGE','CAMERA'];let round=1,score=0,left=30,timer,target='',mixed=[],picked=[];const $=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function make(){picked=[];$('source').innerHTML='';$('answer').innerHTML='';$('msg').textContent='';$('next').style.display='none';$('ok').style.display='inline-block';target=bank[Math.floor(Math.random()*bank.length)];mixed=shuffle(target.split(''));if(mixed.join('')===target)mixed.reverse();mixed.forEach((ch,i)=>{let d=document.createElement('div');d.className='tile';d.textContent=ch;d.onclick=()=>pick(i);$('source').appendChild(d)});$('round').textContent=round;$('score').textContent=score;$('fill').style.width=((round-1)*10)+'%';clock()}function pick(i){if(picked.includes(i))return;picked.push(i);draw()}function draw(){[...$('source').children].forEach((e,i)=>e.classList.toggle('on',picked.includes(i)));$('answer').innerHTML='';picked.forEach(i=>{let d=document.createElement('div');d.className='tile';d.textContent=mixed[i];d.onclick=()=>{picked=picked.filter(x=>x!==i);draw()};$('answer').appendChild(d)})}function clear(){picked=[];draw()}function check(){let val=picked.map(i=>mixed[i]).join('');if(val===target){$('msg').textContent='Correct!';$('msg').style.color='#4ecdc4';score+=left;$('score').textContent=score;clearInterval(timer);$('next').style.display='inline-block';$('ok').style.display='none'}else{$('msg').textContent='Try again!';$('msg').style.color='#ff6b6b';clear()}}function hint(){$('msg').textContent='Starts with '+target[0]+' • '+target.length+' letters'}function next(){round++;if(round>10){end()}else make()}function clock(){clearInterval(timer);left=30;$('time').textContent=left;timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0){clearInterval(timer);$('msg').textContent='Answer: '+target;$('next').style.display='inline-block';$('ok').style.display='none'}},1000)}function end(){clearInterval(timer);$('fill').style.width='100%';$('final').textContent=score;$('over').classList.add('show')}function restart(){$('over').classList.remove('show');round=1;score=0;make()}$('clear').onclick=clear;$('hint').onclick=hint;$('ok').onclick=check;$('next').onclick=next;$('again').onclick=restart;make();</script></body></html>
