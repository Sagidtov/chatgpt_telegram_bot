<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Highway Rush</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 8px;
        }

        .game-container {
            position: relative;
            background: #111;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 16px;
            background: #333;
            touch-action: none;
        }

        .hud {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        .hud-block {
            background: rgba(0, 0, 0, 0.55);
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 13px;
            line-height: 1.3;
        }

        .hud-label {
            opacity: 0.8;
            font-size: 11px;
        }

        .hud-value {
            font-weight: 600;
        }

        .pause-button {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 999px;
            border: none;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .pause-button:active {
            transform: scale(0.95);
        }

        .controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 16px;
            z-index: 5;
            padding: 0 16px;
        }

        .control-btn {
            flex: 1;
            max-width: 120px;
            padding: 12px 0;
            border-radius: 999px;
            border: none;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .control-btn:active {
            transform: scale(0.97);
        }

        /* На десктопе убираем виртуальные кнопки (мышь/клава удобнее) */
        @media (hover: hover) and (pointer: fine) {
            .controls {
                display: none;
            }
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.95));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-panel {
            text-align: center;
            padding: 16px 18px 20px;
            max-width: 90%;
        }

        .overlay-title {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .overlay-subtitle {
            font-size: 13px;
            opacity: 0.85;
            margin-bottom: 12px;
        }

        .overlay-score {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .overlay button {
            margin-top: 6px;
            padding: 10px 24px;
            border-radius: 999px;
            border: none;
            background: #ffcd2c;
            color: #000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }

        .overlay button:active {
            transform: scale(0.97);
        }

        .overlay-hint {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 10px;
            line-height: 1.4;
        }

        .footer-hint {
            text-align: center;
            font-size: 11px;
            opacity: 0.6;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-container">
        <canvas id="gameCanvas" width="360" height="640"></canvas>

        <div class="hud">
            <div class="hud-block">
                <div class="hud-label">Очки</div>
                <div class="hud-value" id="scoreText">0</div>
            </div>
            <div class="hud-block">
                <div class="hud-label">Рекорд</div>
                <div class="hud-value" id="bestText">0</div>
            </div>
        </div>

        <button class="pause-button" id="pauseBtn">▶</button>

        <div class="controls">
            <button class="control-btn" id="btnLeft">◀</button>
            <button class="control-btn" id="btnRight">▶</button>
        </div>

        <div class="overlay" id="overlay">
            <div class="overlay-panel">
                <div class="overlay-title">Highway Rush</div>
                <div class="overlay-subtitle" id="overlaySubtitle">
                    Уворачивайтесь от машин и держитесь как можно дольше!
                </div>
                <div class="overlay-score" id="overlayScore"></div>
                <button id="startBtn">Старт</button>
                <div class="overlay-hint">
                    Мобильные: свайп влево/вправо или кнопки ◀ ▶.<br />
                    ПК: стрелки / A D, пробел — старт/рестарт.
                </div>
            </div>
        </div>
    </div>
    <div class="footer-hint">
        Сделано на чистых HTML5 Canvas + JS
    </div>
</div>

<script>
    // ==========================
    // Константы и базовая конфигурация
    // ==========================

    const GAME_WIDTH = 360;
    const GAME_HEIGHT = 640;
    const LANE_COUNT = 3;

    const PLAYER_WIDTH = 40;
    const PLAYER_HEIGHT = 70;
    const OBSTACLE_WIDTH = 40;
    const OBSTACLE_HEIGHT = 70;

    const BASE_SPEED = 160; // px/сек
    const MAX_SPEED = 420;
    const SPEED_INCREASE_PER_SEC = 10;

    const SPAWN_INTERVAL_MAX = 1.1; // сек в начале
    const SPAWN_INTERVAL_MIN = 0.4; // сек при максимальной сложности

    const MAX_OBSTACLES = 12;

    const GAME_STATE = {
        IDLE: "idle",
        PLAYING: "playing",
        PAUSED: "paused",
        GAMEOVER: "gameover"
    };

    // ==========================
    // Переменные игры
    // ==========================

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("scoreText");
    const bestText = document.getElementById("bestText");
    const overlay = document.getElementById("overlay");
    const overlaySubtitle = document.getElementById("overlaySubtitle");
    const overlayScore = document.getElementById("overlayScore");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const btnLeft = document.getElementById("btnLeft");
    const btnRight = document.getElementById("btnRight");

    let gameState = GAME_STATE.IDLE;

    let lanesX = []; // X-координаты центров полос
    let player = {
        laneIndex: 1,
        targetLane: 1,
        x: 0,
        y: 0,
        laneMoveSpeed: 12 // скорость интерполяции по X
    };

    let obstacles = [];
    let score = 0;
    let bestScore = 0;
    let elapsedTime = 0;
    let roadOffset = 0;
    let currentSpeed = BASE_SPEED;
    let spawnTimer = 0;
    let spawnInterval = SPAWN_INTERVAL_MAX;

    let lastTimestamp = 0;

    // Для свайпов
    let touchStartX = null;
    let touchStartY = null;
    const SWIPE_THRESHOLD = 30; // минимальное смещение для свайпа

    // ==========================
    // Инициализация
    // ==========================

    function init() {
        // Центры полос немного уже ширины дороги, чтобы было красивее
        const roadMargin = 40;
        const roadWidth = GAME_WIDTH - roadMargin * 2;
        const laneWidth = roadWidth / LANE_COUNT;

        lanesX.length = 0;
        for (let i = 0; i < LANE_COUNT; i++) {
            lanesX.push(roadMargin + laneWidth * (i + 0.5));
        }

        player.laneIndex = 1;
        player.targetLane = 1;
        player.y = GAME_HEIGHT - PLAYER_HEIGHT - 30;
        player.x = lanesX[player.laneIndex];

        obstacles = [];
        for (let i = 0; i < MAX_OBSTACLES; i++) {
            obstacles.push({
                active: false,
                laneIndex: 0,
                x: 0,
                y: 0,
                colorIndex: 0
            });
        }

        // Рекорд из localStorage
        try {
            const saved = localStorage.getItem("highway_rush_best");
            if (saved != null) {
                bestScore = parseInt(saved, 10) || 0;
            }
        } catch (e) {
            bestScore = 0;
        }
        bestText.textContent = bestScore.toString();

        attachInputListeners();
        requestAnimationFrame(gameLoop);
    }

    function resetGame() {
        score = 0;
        elapsedTime = 0;
        roadOffset = 0;
        currentSpeed = BASE_SPEED;
        spawnTimer = 0;
        spawnInterval = SPAWN_INTERVAL_MAX;

        player.laneIndex = 1;
        player.targetLane = 1;
        player.x = lanesX[player.laneIndex];

        for (let i = 0; i < obstacles.length; i++) {
            obstacles[i].active = false;
        }

        updateHud();
    }

    // ==========================
    // Игровой цикл
    // ==========================

    function gameLoop(timestamp) {
        if (!lastTimestamp) {
            lastTimestamp = timestamp;
        }
        const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05); // защита от больших скачков
        lastTimestamp = timestamp;

        update(dt);
        render();

        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        if (gameState !== GAME_STATE.PLAYING) {
            return;
        }

        // Время и сложность
        elapsedTime += dt;

        currentSpeed += SPEED_INCREASE_PER_SEC * dt;
        if (currentSpeed > MAX_SPEED) currentSpeed = MAX_SPEED;

        const t = (currentSpeed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED);
        spawnInterval = SPAWN_INTERVAL_MAX - (SPAWN_INTERVAL_MAX - SPAWN_INTERVAL_MIN) * clamp(t, 0, 1);

        // Сдвиг дорожной разметки
        roadOffset += currentSpeed * dt * 0.5;
        if (roadOffset > 40) {
            roadOffset -= 40;
        }

        // Плавное движение между полосами
        const targetX = lanesX[player.targetLane];
        const dx = targetX - player.x;
        player.x += dx * Math.min(player.laneMoveSpeed * dt, 1);

        // Обновление препятствий
        const speedFactor = currentSpeed * dt;
        for (let i = 0; i < obstacles.length; i++) {
            const o = obstacles[i];
            if (!o.active) continue;
            o.y += speedFactor;

            if (o.y > GAME_HEIGHT + OBSTACLE_HEIGHT) {
                o.active = false;
                score += 10;
            } else {
                // Проверка столкновения
                if (checkCollision(player.x - PLAYER_WIDTH / 2, player.y, PLAYER_WIDTH, PLAYER_HEIGHT,
                    o.x - OBSTACLE_WIDTH / 2, o.y, OBSTACLE_WIDTH, OBSTACLE_HEIGHT)) {
                    handleGameOver();
                    return;
                }
            }
        }

        // Спавн новых машин
        spawnTimer += dt;
        if (spawnTimer >= spawnInterval) {
            spawnTimer -= spawnInterval;
            spawnObstacleRow();
        }

        // Тики очков за выживание
        score += Math.floor(currentSpeed * dt * 0.05);

        updateHud();
    }

    // ==========================
    // Спавн и логика препятствий
    // ==========================

    function spawnObstacleRow() {
        // Не более 2 активных препятствий за раз в одном ряду
        const lanesIndices = shuffleArray([0, 1, 2]);
        const maxInRow = 2;
        let spawned = 0;

        for (let i = 0; i < lanesIndices.length && spawned < maxInRow; i++) {
            const laneIndex = lanesIndices[i];

            // Немного избегаем спавна прямо над игроком, чтобы не было "подстав"
            if (laneIndex === player.targetLane && Math.random() < 0.35) {
                continue;
            }

            const obstacle = getInactiveObstacle();
            if (!obstacle) return;

            obstacle.active = true;
            obstacle.laneIndex = laneIndex;
            obstacle.x = lanesX[laneIndex];
            obstacle.y = -OBSTACLE_HEIGHT - 5;
            obstacle.colorIndex = Math.floor(Math.random() * 4);

            spawned++;
        }
    }

    function getInactiveObstacle() {
        for (let i = 0; i < obstacles.length; i++) {
            if (!obstacles[i].active) return obstacles[i];
        }
        return null;
    }

    // ==========================
    // Обработка завершения игры
    // ==========================

    function handleGameOver() {
        gameState = GAME_STATE.GAMEOVER;

        if (score > bestScore) {
            bestScore = score;
            bestText.textContent = bestScore.toString();
            try {
                localStorage.setItem("highway_rush_best", bestScore.toString());
            } catch (e) {}
        }

        overlaySubtitle.textContent = "Столкновение! Но можно попробовать ещё раз.";
        overlayScore.textContent = "Счёт: " + score + " • Рекорд: " + bestScore;
        startBtn.textContent = "Играть снова";
        overlay.classList.remove("hidden");
        pauseBtn.textContent = "▶";
    }

    // ==========================
    // Отрисовка
    // ==========================

    function render() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        drawRoad();
        drawObstacles();
        drawPlayer();
    }

    function drawRoad() {
        const roadMargin = 40;
        const roadWidth = GAME_WIDTH - roadMargin * 2;

        // Асфальт
        ctx.fillStyle = "#303030";
        ctx.fillRect(roadMargin, 0, roadWidth, GAME_HEIGHT);

        // Боковые границы
        ctx.fillStyle = "#d0d0d0";
        ctx.fillRect(roadMargin - 4, 0, 4, GAME_HEIGHT);
        ctx.fillRect(roadMargin + roadWidth, 0, 4, GAME_HEIGHT);

        // Разделительные полосы
        const laneWidth = roadWidth / LANE_COUNT;
        ctx.lineWidth = 3;
        ctx.setLineDash([16, 16]);
        ctx.strokeStyle = "rgba(255,255,255,0.7)";

        for (let i = 1; i < LANE_COUNT; i++) {
            const x = roadMargin + laneWidth * i;
            ctx.save();
            ctx.translate(0, roadOffset);
            ctx.beginPath();
            ctx.moveTo(x, -40);
            ctx.lineTo(x, GAME_HEIGHT + 40);
            ctx.stroke();
            ctx.restore();
        }
        ctx.setLineDash([]);
    }

    function drawPlayer() {
        // Тело машины
        drawCar(player.x, player.y, PLAYER_WIDTH, PLAYER_HEIGHT, "#ff4b4b", true);
    }

    function drawObstacles() {
        const colors = ["#4bd9ff", "#ffd54b", "#9b7bff", "#55ff8a"];
        for (let i = 0; i < obstacles.length; i++) {
            const o = obstacles[i];
            if (!o.active) continue;
            const color = colors[o.colorIndex % colors.length];
            drawCar(o.x, o.y, OBSTACLE_WIDTH, OBSTACLE_HEIGHT, color, false);
        }
    }

    function drawCar(cx, y, w, h, color, isPlayer) {
        const x = cx - w / 2;
        const r = 8;

        // Тень
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.ellipse(cx, y + h, w * 0.7, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;

        // Корпус
        ctx.fillStyle = color;
        drawRoundedRect(x, y, w, h, r);
        ctx.fill();

        // Окно
        ctx.fillStyle = "#20252b";
        drawRoundedRect(x + 6, y + 10, w - 12, h / 2.4, r / 1.5);
        ctx.fill();

        // Фары/стопы
        if (isPlayer) {
            ctx.fillStyle = "#fffbcc";
            ctx.fillRect(x + 4, y + 4, 8, 6);
            ctx.fillRect(x + w - 12, y + 4, 8, 6);
        } else {
            ctx.fillStyle = "#ff7777";
            ctx.fillRect(x + 4, y + h - 8, 8, 4);
            ctx.fillRect(x + w - 12, y + h - 8, 8, 4);
        }
    }

    // ==========================
    // HUD
    // ==========================

    function updateHud() {
        scoreText.textContent = score.toString();
    }

    // ==========================
    // Ввод и управление
    // ==========================

    function attachInputListeners() {
        // Клавиатура
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
                e.preventDefault();
                movePlayerLeft();
            } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
                e.preventDefault();
                movePlayerRight();
            } else if (e.key === " " || e.key === "Enter") {
                e.preventDefault();
                if (gameState === GAME_STATE.IDLE || gameState === GAME_STATE.GAMEOVER) {
                    startGame();
                }
            } else if (e.key === "p" || e.key === "P") {
                e.preventDefault();
                togglePause();
            }
        });

        // Виртуальные кнопки
        btnLeft.addEventListener("touchstart", (e) => {
            e.preventDefault();
            movePlayerLeft();
        });
        btnLeft.addEventListener("mousedown", (e) => {
            e.preventDefault();
            movePlayerLeft();
        });

        btnRight.addEventListener("touchstart", (e) => {
            e.preventDefault();
            movePlayerRight();
        });
        btnRight.addEventListener("mousedown", (e) => {
            e.preventDefault();
            movePlayerRight();
        });

        // Пауза
        pauseBtn.addEventListener("click", () => {
            if (gameState === GAME_STATE.IDLE || gameState === GAME_STATE.GAMEOVER) {
                startGame();
            } else {
                togglePause();
            }
        });

        // Старт/рестарт через оверлей
        startBtn.addEventListener("click", () => {
            startGame();
        });

        // Свайпы по канвасу
        canvas.addEventListener("touchstart", handleTouchStart, { passive: false });
        canvas.addEventListener("touchmove", handleTouchMove, { passive: false });
        canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
    }

    function movePlayerLeft() {
        if (player.targetLane > 0) {
            player.targetLane--;
        }
    }

    function movePlayerRight() {
        if (player.targetLane < LANE_COUNT - 1) {
            player.targetLane++;
        }
    }

    function startGame() {
        resetGame();
        overlay.classList.add("hidden");
        overlayScore.textContent = "";
        overlaySubtitle.textContent = "Уворачивайтесь от машин и держитесь как можно дольше!";
        gameState = GAME_STATE.PLAYING;
        pauseBtn.textContent = "II";
    }

    function togglePause() {
        if (gameState === GAME_STATE.PLAYING) {
            gameState = GAME_STATE.PAUSED;
            overlaySubtitle.textContent = "Пауза";
            overlayScore.textContent = "Счёт: " + score;
            startBtn.textContent = "Продолжить";
            overlay.classList.remove("hidden");
            pauseBtn.textContent = "▶";
        } else if (gameState === GAME_STATE.PAUSED) {
            overlay.classList.add("hidden");
            overlayScore.textContent = "";
            overlaySubtitle.textContent = "Уворачивайтесь от машин и держитесь как можно дольше!";
            gameState = GAME_STATE.PLAYING;
            pauseBtn.textContent = "II";
        }
    }

    // Обработка свайпов
    function handleTouchStart(e) {
        if (e.touches.length > 1) return;
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
    }

    function handleTouchMove(e) {
        // Предотвращаем скролл, пока палец на игре
        if (e.cancelable) {
            e.preventDefault();
        }
    }

    function handleTouchEnd(e) {
        if (touchStartX === null || touchStartY === null) return;

        const touch = e.changedTouches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;

        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);

        if (absDx > SWIPE_THRESHOLD && absDx > absDy) {
            if (dx < 0) {
                movePlayerLeft();
            } else {
                movePlayerRight();
            }
        }

        touchStartX = null;
        touchStartY = null;
    }

    // ==========================
    // Утилиты
    // ==========================

    function clamp(value, min, max) {
        return value < min ? min : value > max ? max : value;
    }

    function checkCollision(x1, y1, w1, h1, x2, y2, w2, h2) {
        return (
            x1 < x2 + w2 &&
            x1 + w1 > x2 &&
            y1 < y2 + h2 &&
            y1 + h1 > y2
        );
    }

    function drawRoundedRect(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }

    // Перемешивание массива (для рандомных полос)
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = (Math.random() * (i + 1)) | 0;
            const tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
        }
        return arr;
    }

    // ==========================
    // Запуск
    // ==========================

    init();
</script>
</body>
</html>
